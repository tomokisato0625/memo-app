{% extends 'layout.html' %}
{% block content %}
<form action="/update/{{ post.id }}" method="post">
    <label for="title">タイトル</label><br>
    <input id="title" type="text" name="title" value="{{ post.title }}">
    <p></p>
    <label for="content">本文</label><br>
    <textarea id="content" name="content" cols="40" rows="10">{{ post.content}}</textarea>
    <p></p>
    <button type="submit" class="button save-button">保存する</button>
    <a href='/' class="button back-button">キャンセル</a>
</form>
{% endblock %}
