{% extends 'layout.html' %}
{% block content %}
<h1>{{ message }}</h1>

<ul class="post-list">
    {% for post in posts %}
    <li>
        <a href="/show/{{ post.id }}" class="button show-button">
            {{ post.title }}
        </a>

         {% if post.created_at %}
        <p>
            {{ post.created_at.strftime('%Y/%m/%d %H:%M') }}
        </p>
    {% endif %}
    </li>
    {% endfor %}
</ul>

<p><a href='/new' class="button new-button">新規メモ</a></p>

{% endblock %}
